<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess with friends</title>
<style>
:root{--bg:#f4f1ea;--fg:#1f1d1a;--card:#fff;--mut:#7a746a;--bd:#ddd6c8;--lt:#f0d9b5;--dk:#b58863;--acc:#3b7d3b;--hl:rgba(255,213,0,.45);--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b19;--fg:#ece8df;--card:#2a2825;--mut:#9a9488;--bd:#3d3a35}}
:root[data-theme="dark"]{--bg:#1c1b19;--fg:#ece8df;--card:#2a2825;--mut:#9a9488;--bd:#3d3a35}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
h1 small{font-size:13px;color:var(--mut);font-weight:400}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0 0 8px}
.chips,.row{display:flex;flex-wrap:wrap;gap:8px}.row{align-items:center}
button,input{font:inherit;color:inherit}
.chip,.btn{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer}
.chip.on,.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.bad{color:var(--bad)}.btn:disabled{opacity:.45;cursor:default}
input{border:1px solid var(--bd);border-radius:10px;padding:8px 12px;background:var(--bg);flex:1;min-width:0}
.mut{color:var(--mut);font-size:14px}
#bd{display:grid;grid-template-columns:repeat(8,1fr);width:100%;max-width:min(100%,calc(100dvh - 270px));min-width:280px;margin:0 auto;aspect-ratio:1;border-radius:6px;overflow:hidden;user-select:none;container-type:inline-size}
.sq{position:relative;display:flex;align-items:center;justify-content:center;font-size:10cqw;line-height:1;cursor:pointer;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif}
.l{background:var(--lt)}.d{background:var(--dk)}
.lm{background-image:linear-gradient(var(--hl),var(--hl))}
.sel{box-shadow:inset 0 0 0 4px rgba(20,120,20,.65)}
.ck{background-image:radial-gradient(circle,rgba(220,40,40,.85),transparent 70%)}
.mv::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(20,100,20,.45)}
.mv.cp::after{width:92%;height:92%;background:none;border:5px solid rgba(20,100,20,.45)}
.pw{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 1px #000}.pb{color:#111;text-shadow:0 0 1px #999}
.pl{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;max-width:min(100%,calc(100dvh - 270px));min-width:280px;margin:0 auto;gap:8px}
.clk{font:600 20px ui-monospace,Menlo,Consolas,monospace;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:2px 10px;min-width:84px;text-align:center}
.clk.run{background:var(--acc);color:#fff;border-color:var(--acc)}.clk.run.low{background:var(--bad);border-color:var(--bad)}
#st{text-align:center;min-height:26px;font-weight:600;margin-top:4px}
#mv{font-size:14px;color:var(--mut);max-height:76px;overflow:auto;padding:4px 2px;margin-bottom:8px}
#pr{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:5}#pr.on{display:flex}
#pr div{background:var(--card);padding:12px;border-radius:12px;display:flex;gap:8px}
#pr button{font-size:44px;width:64px;height:64px;border:1px solid var(--bd);border-radius:10px;background:var(--lt);cursor:pointer;line-height:1}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:6;max-width:90%}#toast.on{opacity:1}
</style></head><body>
<div id="app">
<h1><span>♞ Chess</span><small id="who"></small></h1>
<section id="menu">
<div class="card"><h2>Time control</h2><div class="chips" id="tcs"></div></div>
<div class="card"><h2>Play as</h2><div class="chips" id="cols"></div></div>
<div class="card"><h2>Start</h2><div class="row"><button class="btn pri" id="bOn">Challenge a friend</button><button class="btn" id="bLoc">Pass &amp; play (this device)</button></div><div class="mut" id="offl" style="margin-top:8px"></div></div>
<div class="card"><h2>Join or watch a game</h2><div class="row"><input id="code" placeholder="Game code" maxlength="8" autocapitalize="off" autocomplete="off"><button class="btn" id="bJoin">Join</button></div><div class="row" id="resume" style="margin-top:8px"></div></div>
<div class="card"><h2>Open challenges</h2><div id="lobby" class="mut">Sign in to see challenges.</div></div>
</section>
<section id="game" hidden>
<div class="pl"><b id="nT"></b><span class="clk" id="cT"></span></div>
<div id="bd"></div>
<div class="pl"><b id="nB"></b><span class="clk" id="cB"></span></div>
<div id="st"></div><div id="mv"></div><div class="row" id="acts" style="justify-content:center"></div>
</section></div>
<div id="pr"><div></div></div><div id="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s),E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
/* ---------- chess rules ---------- */
const D=[[-1,-1],[-1,1],[1,-1],[1,1]],O=[[-1,0],[1,0],[0,-1],[0,1]],KN=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
const at=(b,r,f)=>r<0||r>7||f<0||f>7?null:b[r*8+f],own=(p,c)=>p&&(c=='w'?p<'a':p>'Z');
const sq=i=>'abcdefgh'[i&7]+(8-(i>>3)),ms=m=>sq(m.f)+sq(m.t)+(m.p||'');
const START=()=>{const b=[];for(const ch of'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR'){if(ch=='/')continue;if(ch>='1'&&ch<='8')for(let k=0;k<+ch;k++)b.push('');else b.push(ch)}return{b,t:'w',c:'KQkq',e:-1,h:0,n:1}};
function att(b,q,by){const r=q>>3,f=q&7,w=by=='w',P=w?'P':'p',N=w?'N':'n',K=w?'K':'k',B=w?'B':'b',R=w?'R':'r',Q=w?'Q':'q';
 for(const d of[-1,1])if(at(b,r+(w?1:-1),f+d)===P)return 1;
 for(const[a,c]of KN)if(at(b,r+a,f+c)===N)return 1;
 for(const[a,c]of D.concat(O))if(at(b,r+a,f+c)===K)return 1;
 for(const[a,c]of D){let y=r+a,x=f+c,p;while((p=at(b,y,x))==='')y+=a,x+=c;if(p===B||p===Q)return 1}
 for(const[a,c]of O){let y=r+a,x=f+c,p;while((p=at(b,y,x))==='')y+=a,x+=c;if(p===R||p===Q)return 1}
 return 0}
function gen(s){const{b,t,c,e}=s,w=t=='w',L=[];
 for(let i=0;i<64;i++){const p=b[i];if(!own(p,t))continue;const r=i>>3,f=i&7,k=p.toUpperCase();
  const push=(to,x)=>{if(k=='P'&&(to>>3)==(w?0:7))for(const q of'qrbn')L.push({f:i,t:to,p:q});else L.push(x?{f:i,t:to,x:1}:{f:i,t:to})};
  if(k=='P'){const d=w?-1:1;
   if(at(b,r+d,f)===''){push(i+d*8);if(r==(w?6:1)&&at(b,r+2*d,f)==='')L.push({f:i,t:i+d*16})}
   for(const dx of[-1,1]){const q=at(b,r+d,f+dx),to=i+d*8+dx;if(q&&!own(q,t))push(to);else if(q===''&&to==e)push(to,1)}}
  else if(k=='N'){for(const[a,dc]of KN){const q=at(b,r+a,f+dc);if(q===''||(q&&!own(q,t)))L.push({f:i,t:(r+a)*8+f+dc})}}
  else if(k=='K'){for(const[a,dc]of D.concat(O)){const q=at(b,r+a,f+dc);if(q===''||(q&&!own(q,t)))L.push({f:i,t:(r+a)*8+f+dc})}
   if(i==(w?60:4)){const h=w?56:0,R=w?'R':'r',o=w?'b':'w';
    if(c.includes(w?'K':'k')&&!b[h+5]&&!b[h+6]&&b[h+7]===R&&!att(b,h+4,o)&&!att(b,h+5,o))L.push({f:i,t:h+6,k:1});
    if(c.includes(w?'Q':'q')&&!b[h+3]&&!b[h+2]&&!b[h+1]&&b[h]===R&&!att(b,h+4,o)&&!att(b,h+3,o))L.push({f:i,t:h+2,k:1})}}
  else{for(const[a,dc]of(k=='B'?D:k=='R'?O:D.concat(O))){let y=r+a,x=f+dc,q;while((q=at(b,y,x))===''){L.push({f:i,t:y*8+x});y+=a;x+=dc}if(q&&!own(q,t))L.push({f:i,t:y*8+x})}}}
 return L}
function mk(s,m){const b=s.b.slice(),p=b[m.f],w=s.t=='w',cap=b[m.t]||m.x;let c=s.c,e=-1,h=s.h+1;
 b[m.t]=m.p?(w?m.p.toUpperCase():m.p):p;b[m.f]='';
 if(m.x)b[m.t+(w?8:-8)]='';
 if(m.k){const a=m.t>m.f?m.f+3:m.f-4,z=m.t>m.f?m.f+1:m.f-1;b[z]=b[a];b[a]=''}
 if(p.toUpperCase()=='P'){h=0;if(Math.abs(m.t-m.f)==16)e=(m.f+m.t)/2}if(cap)h=0;
 for(const q of[m.f,m.t]){if(q==60)c=c.replace(/[KQ]/g,'');if(q==4)c=c.replace(/[kq]/g,'');if(q==63)c=c.replace('K','');if(q==56)c=c.replace('Q','');if(q==7)c=c.replace('k','');if(q==0)c=c.replace('q','')}
 return{b,t:w?'b':'w',c,e,h,n:s.n+(w?0:1)}}
const inCheck=s=>att(s.b,s.b.indexOf(s.t=='w'?'K':'k'),s.t=='w'?'b':'w');
const legal=s=>gen(s).filter(m=>{const n=mk(s,m);return!att(n.b,n.b.indexOf(s.t=='w'?'K':'k'),n.t)});
function san(s,m,L){const p=s.b[m.f],k=p.toUpperCase(),n=mk(s,m),cap=s.b[m.t]||m.x;let o;
 if(m.k)o=m.t>m.f?'O-O':'O-O-O';
 else{o=k=='P'?(cap?sq(m.f)[0]:''):k;
  if(k!='P'){const A=L.filter(x=>x.t==m.t&&x.f!=m.f&&s.b[x.f]==p);if(A.length)o+=A.some(x=>(x.f&7)==(m.f&7))?(A.some(x=>(x.f>>3)==(m.f>>3))?sq(m.f):sq(m.f)[1]):sq(m.f)[0]}
  o+=(cap?'x':'')+sq(m.t)+(m.p?'='+m.p.toUpperCase():'')}
 return o+(inCheck(n)?(legal(n).length?'+':'#'):'')}
const key=s=>s.b.map(p=>p||'.').join('')+s.t+s.c+(s.e<0?'':s.e);
let rc={k:'',v:null};
function rp(mv){const k=mv.join();if(rc.v&&rc.k===k)return rc.v;let s=START(),pos=[s],sn=[],keys=[key(s)];
 for(const u of mv){const L=legal(s),m=L.find(x=>ms(x)==u);if(!m)break;sn.push(san(s,m,L));s=mk(s,m);pos.push(s);keys.push(key(s))}
 rc={k,v:{pos,sn,keys}};return rc.v}
function ending(s,keys){const L=legal(s),o=s.t=='w'?'b':'w';
 if(!L.length)return inCheck(s)?{r:o,y:'checkmate'}:{r:'d',y:'stalemate'};
 const x=s.b.filter(p=>p&&p.toUpperCase()!='K');
 if(!x.length||(x.length==1&&'NBnb'.includes(x[0])))return{r:'d',y:'insufficient material'};
 if(s.h>=100)return{r:'d',y:'50-move rule'};
 const k=keys[keys.length-1];if(keys.filter(z=>z==k).length>=3)return{r:'d',y:'threefold repetition'}}
/* ---------- app state ---------- */
const GL={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟\uFE0E'},RT={w:'White wins',b:'Black wins',d:'Draw'};
const PRE=[[60,0],[120,1],[180,0],[180,2],[300,0],[300,3],[600,0],[900,10],[1800,0],[0,0]];
const tcl=t=>t.b?(t.b/60)+'+'+t.i:'∞',tcn=t=>!t.b?'Casual':t.b+40*t.i<180?'Bullet':t.b+40*t.i<480?'Blitz':t.b+40*t.i<1500?'Rapid':'Classical';
let tc={b:300,i:3},pick='r',db=null,user=null,uid=null,G=null,ref=null,unsub=null,sel=-1,leg=[],flip=false,BOT='w',arm=0,LS=null,NM={};
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',3200)};
const mkb=(t,f,c)=>{const b=E('button','btn '+(c||''),t);b.onclick=f;return b};
const show=v=>{$('#menu').hidden=v!='menu';$('#game').hidden=v!='game'};
const turnOf=()=>G.moves.length%2?'b':'w';
const side=()=>G.loc?turnOf():(G.w===uid&&G.b===uid?turnOf():G.w===uid?'w':G.b===uid?'b':null);
const rem=sd=>{let v=G.clk[sd];if(G.status=='active'&&G.moves.length>=2&&turnOf()==sd)v-=Date.now()-G.ts;return Math.max(0,v)};
const fmt=v=>{if(!G.tc.b)return'∞';if(v<10000)return(v/1000).toFixed(1);const s=Math.ceil(v/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
async function names(ids){const need=[...new Set(ids)].filter(i=>i&&!NM[i]);if(!need.length||!user)return;
 try{const p=await user.profiles(need);need.forEach(i=>NM[i]=(p[i]&&p[i].name)||'Player')}catch(e){need.forEach(i=>NM[i]='Player')}
 if(LS)lob(LS);if(G)draw()}
const lab=sd=>(sd=='w'?'○ ':'● ')+(G.loc?(sd=='w'?'White':'Black'):G[sd]?(NM[G[sd]]||'Player')+(G[sd]===uid?' (you)':''):'Waiting…');
/* ---------- menu ---------- */
function menu(){const T=$('#tcs');T.replaceChildren();
 for(const[b,i]of PRE){const t={b,i},c=E('button','chip'+(tc.b==b&&tc.i==i?' on':''),tcl(t)+' · '+tcn(t));c.onclick=()=>{tc=t;menu()};T.append(c)}
 const C=$('#cols');C.replaceChildren();
 for(const[n,v]of[['White','w'],['Random','r'],['Black','b']]){const c=E('button','chip'+(pick==v?' on':''),n);c.onclick=()=>{pick=v;menu()};C.append(c)}
 const on=!!(db&&uid);$('#bOn').disabled=!on;$('#bJoin').disabled=!on;
 $('#offl').textContent=on?'Friends need the same page link (shared with edit access) and your game code.':'Online play needs you to be signed in to claude.ai. Pass & play always works.';
 const R=$('#resume');R.replaceChildren();let lg=null;try{lg=localStorage.getItem('lastGame')}catch(e){}
 if(lg&&on)R.append(mkb('Resume game '+lg.toUpperCase(),()=>open(lg)))}
const rid=()=>{let s='';for(let i=0;i<5;i++)s+='abcdefghjkmnpqrstuvwxyz23456789'[Math.random()*31|0];return s};
async function create(){try{const code=rid(),col=pick=='r'?(Math.random()<.5?'w':'b'):pick;
 await db.doc('games/'+code).set({tc:{b:tc.b,i:tc.i},w:col=='w'?uid:'',b:col=='b'?uid:'',status:'waiting',moves:[],clk:{w:tc.b*1000,b:tc.b*1000},ts:0,result:'',reason:'',draw:'',made:Date.now()});open(code)}catch(e){toast('Couldn’t create game: '+(e.message||e.code))}}
async function join(c){c=(c||'').trim().toLowerCase();if(!c)return;
 try{const r=db.doc('games/'+c),sn=await r.get();if(!sn.exists)return toast('No game with that code');const d=sn.data();
  if(d.status=='waiting'&&d.w!==uid&&d.b!==uid)await r.update({[d.w?'b':'w']:uid,status:'active',ts:Date.now()});open(c)}catch(e){toast('Couldn’t join: '+(e.message||e.code))}}
function lob(sn){const el=$('#lobby'),now=Date.now();el.replaceChildren();
 const ds=sn.docs.map(d=>({id:d.id,...d.data()})).filter(d=>d.made>now-36e5&&d.status=='waiting').sort((a,b)=>b.made-a.made);
 if(!ds.length){el.textContent='No open challenges. Create one and send your friend the code!';return}
 names(ds.map(d=>d.w||d.b));
 for(const d of ds){const who=d.w||d.b,r=E('div','row');r.style.cssText='justify-content:space-between;margin:6px 0';
  r.append(E('span','',(NM[who]||'Player')+' · '+tcl(d.tc)+' · plays '+(d.w?'White':'Black')+' · '+d.id.toUpperCase()),mkb(who===uid?'Open':'Accept',()=>join(d.id),who===uid?'':'pri'));el.append(r)}}
function leave(){if(unsub)unsub();unsub=ref=null;G=null;sel=-1;leg=[];arm=0}
function open(c){leave();c=c.toLowerCase();ref=db.doc('games/'+c);
 unsub=ref.onSnapshot(sn=>{if(!sn.exists){toast(G?'That game was cancelled':'Game not found');if(G)home();return}
  G={...sn.data(),id:c};names([G.w,G.b]);sel=-1;leg=[];show('game');draw()},e=>toast(e.message||'Connection problem'));
 try{localStorage.setItem('lastGame',c)}catch(e){}}
function home(){leave();show('menu');menu()}
function local(){leave();G={loc:1,tc:{b:tc.b,i:tc.i},w:'',b:'',status:'active',moves:[],clk:{w:tc.b*1000,b:tc.b*1000},ts:Date.now(),result:'',reason:'',draw:''};show('game');draw()}
/* ---------- playing ---------- */
function commit(p){Object.assign(G,p);draw();if(!G.loc&&ref)ref.update(p).catch(e=>toast('Couldn’t send: '+(e.message||e.code)))}
function play(m){if(G.status!='active')return;const t=turnOf(),now=Date.now(),run=G.moves.length>=2;let clk={...G.clk};
 if(G.tc.b&&run){if(rem(t)<=0)return;clk[t]=rem(t)+G.tc.i*1000}
 const moves=G.moves.concat(ms(m)),R=rp(moves),end=ending(R.pos[R.pos.length-1],R.keys),p={moves,clk,ts:now,draw:''};
 if(end)Object.assign(p,{status:'over',result:end.r,reason:end.y});commit(p)}
function promo(M){const P=$('#pr div'),w=turnOf()=='w';P.replaceChildren();
 for(const q of'qrbn'){const b=E('button','',GL[q.toUpperCase()]);b.style.color=w?'#fff':'#111';b.style.textShadow=w?'0 0 2px #000,0 0 2px #000':'none';b.onclick=()=>{$('#pr').className='';play(M.find(x=>x.p==q))};P.append(b)}
 $('#pr').className='on'}
$('#bd').onclick=e=>{const q=e.target.closest('.sq');if(!q||!G||G.status!='active')return;const i=+q.dataset.i,my=side();if(!my||my!=turnOf())return;
 const R=rp(G.moves),s=R.pos[R.pos.length-1],M=leg.filter(x=>x.t==i);
 if(sel>=0&&M.length){sel=-1;leg=[];if(M[0].p)promo(M);else play(M[0]);return}
 if(own(s.b[i],s.t)){sel=i;leg=legal(s).filter(x=>x.f==i)}else{sel=-1;leg=[]}draw()};
function draw(){if(!G)return;const R=rp(G.moves),s=R.pos[R.pos.length-1],my=side(),over=G.status=='over',lastM=G.moves.length?G.moves[G.moves.length-1]:'';
 let bt=G.loc?'w':(my||'w');if(flip)bt=bt=='w'?'b':'w';BOT=bt;
 const lm=lastM?[lastM.slice(0,2),lastM.slice(2,4)]:[],kq=inCheck(s)?s.b.indexOf(s.t=='w'?'K':'k'):-1;let h='';
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){const i=bt=='w'?r*8+c:(7-r)*8+(7-c),p=s.b[i];let k='sq '+(((i>>3)+(i&7))%2?'d':'l');
  if(lm.includes(sq(i)))k+=' lm';if(i==sel)k+=' sel';if(i==kq)k+=' ck';const t=leg.find(m=>m.t==i);if(t)k+=' mv'+(p||t.x?' cp':'');
  h+='<div class="'+k+'" data-i="'+i+'">'+(p?'<span class="p'+(p<'a'?'w':'b')+'">'+GL[p.toUpperCase()]+'</span>':'')+'</div>'}
 $('#bd').innerHTML=h;$('#nB').textContent=lab(bt);$('#nT').textContent=lab(bt=='w'?'b':'w');
 let st;if(G.status=='waiting')st='Waiting for a friend… code: '+G.id.toUpperCase();
 else if(over)st=RT[G.result]+' — '+G.reason;
 else{st=(s.t=='w'?'White':'Black')+' to move'+(inCheck(s)?' — check!':'');if(!G.loc&&my&&my==s.t)st='Your move'+(inCheck(s)?' — check!':'');if(G.draw)st+=' · draw offered'}
 $('#st').textContent=st;
 $('#mv').textContent=R.sn.map((x,i)=>(i%2?'':(Math.floor(i/2)+1)+'. ')+x).join(' ');$('#mv').scrollTop=1e5;
 const A=$('#acts');A.replaceChildren();
 if(G.status=='waiting'){A.append(mkb('Copy code',()=>{try{navigator.clipboard.writeText(G.id).then(()=>toast('Code copied'),()=>toast('Code: '+G.id))}catch(e){toast('Code: '+G.id)}}),mkb('Cancel challenge',()=>{const r=ref;unsub();unsub=null;G=null;r.delete().catch(()=>{});home()},'bad'))}
 else{A.append(mkb('Flip board',()=>{flip=!flip;draw()}));
  if(!over&&(G.loc||my)){const acc=!G.loc&&G.draw&&G.draw!=my;
   A.append(mkb(acc?'Accept draw':G.loc?'Draw (agreed)':'Offer draw',()=>{if(G.loc||acc)commit({status:'over',result:'d',reason:'agreement',draw:''});else{commit({draw:my});toast('Draw offered')}}));
   A.append(mkb(arm?'Tap again to resign':'Resign',()=>{if(!arm){arm=1;draw();setTimeout(()=>{arm=0;if(G)draw()},3000)}else{arm=0;const sd=G.loc?turnOf():my;commit({status:'over',result:sd=='w'?'b':'w',reason:'resignation'})}},'bad'))}
  A.append(mkb(over?'New game':'Leave',home))}
 tick()}
function tick(){if(!G||$('#game').hidden)return;const t=turnOf(),top=BOT=='w'?'b':'w',run=G.status=='active'&&G.moves.length>=2;
 for(const[el,sd]of[['#cB',BOT],['#cT',top]]){const x=$(el),v=rem(sd);x.textContent=fmt(v);x.className='clk'+(run&&t==sd?' run':'')+(G.tc.b&&run&&t==sd&&v<10000?' low':'')}
 if(G.tc.b&&run&&rem(t)<=0&&(G.loc||side()))commit({status:'over',result:t=='w'?'b':'w',reason:'time ran out',clk:{...G.clk,[t]:0}})}
setInterval(tick,250);
$('#bOn').onclick=create;$('#bLoc').onclick=local;$('#bJoin').onclick=()=>join($('#code').value);$('#code').onkeydown=e=>{if(e.key=='Enter')join(e.target.value)};
menu();
(async()=>{try{if(!window.claude)return;user=await claude.use('user');if(user){uid=await user.id();const me=await user.me();$('#who').textContent=me.name||''}
 db=await claude.use('db');if(db&&uid){db.collection('games').where('status','==','waiting').limit(30).onSnapshot(sn=>{LS=sn;lob(sn)},()=>{$('#lobby').textContent='Lobby unavailable'})}}catch(e){}
 menu()})();
})();
